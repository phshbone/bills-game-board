name: Unpack Sprint 1

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Unpack staged Sprint 1 package
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d sprint1-upload ]; then
            echo "No staged Sprint 1 upload found; nothing to unpack."
            exit 0
          fi

          cat sprint1-upload/part-* > /tmp/sprint1.zip.b64
          base64 --decode /tmp/sprint1.zip.b64 > /tmp/sprint1.zip
          rm -rf /tmp/sprint1
          mkdir -p /tmp/sprint1
          unzip -q /tmp/sprint1.zip -d /tmp/sprint1

          test -d /tmp/sprint1/bills-game-board
          cp -a /tmp/sprint1/bills-game-board/. .
          rm -rf sprint1-upload

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "No repository changes were produced."
            exit 0
          fi

          git commit -m "Install bill's game board Sprint 1 source"
          git push origin HEAD:main
