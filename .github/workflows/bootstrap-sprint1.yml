name: Bootstrap Sprint 1 source

on:
  push:
    paths:
      - 'sprint1-upload/READY'

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check marker
        id: marker
        run: |
          if [ ! -f sprint1-upload/READY ] || [ "$(cat sprint1-upload/READY)" != "go" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Rebuild package
        if: steps.marker.outputs.run == 'true'
        run: |
          cat sprint1-upload/part-* > /tmp/sprint1.b64
          base64 -d /tmp/sprint1.b64 > /tmp/sprint1.zip
          rm -rf /tmp/sprint1
          mkdir -p /tmp/sprint1
          unzip -q /tmp/sprint1.zip -d /tmp/sprint1
          rsync -a --exclude '.git' /tmp/sprint1/bills-game-board/ ./
          printf 'done\n' > sprint1-upload/READY
      - name: Commit unpacked source
        if: steps.marker.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Unpack Sprint 1 foundation" || exit 0
          git push
